services:
  - type: web
    name: smarthospital-mongodb
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_OFFLINE_MOCK_FALLBACK
        value: "True"
      - key: DATABASE_NAME
        value: SmartHospitalDB
